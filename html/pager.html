<!doctype html>
<html>
  <head>
    <meta http-equiv="Content-Security-Policy" content="default-src 'unsafe-inline'" />
    <style>
      [data-theme="dark"] {
        --primary-color: rgba(225, 225, 225, 0.85);
        --background-color: rgba(225, 225, 225, 0.15);
        --previous-cursor: w-resize;
        --next-cursor: e-resize;
      }
      [data-theme="light"] {
        --primary-color: rgba(33, 33, 33, 0.85);
        --background-color: rgba(33, 33, 33, 0.15);
        --previous-cursor: w-resize;
        --next-cursor: e-resize;
      }
      [data-theme="hidden"] {
        --primary-color: rgba(0, 0, 0, 0);
        --background-color: rgba(0, 0, 0, 0);
        --previous-cursor: none;
        --next-cursor: none;
      }
      ::-webkit-scrollbar {
        display: none;
      }
      * {
        margin: 0;
        padding: 0;
        cursor: none;
      }
      html {
        width: 100%;
        height: 100%;
      }
      body {
        display: flex;
        align-items: center;
        width: 100%;
        height: 100%;
      }
      menu {
        display: flex;
        flex-direction: column;
        list-style-type: none;
        width: 100%;
        height: 100%;
      }
      li {
        display: flex;
        flex: 1 1 50%;
        width: 100%;
      }
      li:not(.disabled) #previous {
        cursor: var(--previous-cursor);
      }
      li:not(.disabled) #next {
        cursor: var(--next-cursor);
      }
      button {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        height: 100%;
        border: none;
        cursor: not-allowed;
        color: transparent;
        background-color: transparent;
      }
      svg {
        width: 12px;
        height: 20px;
        pointer-events: none;
        stroke: currentColor;
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-width: 3;
        fill: none;
      }
      button:not(:active) {
        transition: 750ms step-end;
      }
      menu:has(button:active) button {
        background-color: var(--background-color);
        color: var(--primary-color);
        transition-duration: 0ms;
      }
    </style>
  </head>
  <body>
    <menu>
      <li>
        <button id="previous">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 12 20">
            <polyline points="8.5 3 2.5 10 8.5 17" />
          </svg>
        </button>
      </li>
      <li>
        <button id="next">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 12 20">
            <polyline points="3.5 3 9.5 10 3.5 17" />
          </svg>
        </button>
      </li>
    </menu>
    <script>
      const { ipcRenderer } = require("electron");

      const registerSendEvents = () => {
        document.querySelectorAll("button").forEach((button) => {
          button.addEventListener("pointerdown", (e) => {
            ipcRenderer.send("button-click", { id: e.target.id });
          });
        });
      };

      const registerReceiveEvents = () => {
        ipcRenderer.on("button-disabled", (e, button) => {
          document.getElementById(button.id).parentNode.classList.toggle("disabled", button.disabled);
        });
        ipcRenderer.on("data-theme", (e, data) => {
          document.documentElement.setAttribute("data-theme", data.theme);
        });
      };

      registerSendEvents();
      registerReceiveEvents();
    </script>
  </body>
</html>
